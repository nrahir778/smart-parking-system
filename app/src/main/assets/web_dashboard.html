<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Traffic Parking Live Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d14;
      --surface: #111827;
      --surface-elevated: #1b2436;
      --border: #26354a;
      --emerald: #10b981;
      --red: #ef4444;
      --cyan: #0284c7;
      --amber: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --grass-top: #15803d;
      --grass-bot: #14532d;
      --curb: #475569;
      --road: #151922;
      --bay-bg: rgba(19, 27, 40, 0.85);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9;
        --surface: #ffffff;
        --surface-elevated: #f8fafc;
        --border: #cbd5e1;
        --text: #0f172a;
        --text-muted: #64748b;
        --grass-top: #22c55e;
        --grass-bot: #16a34a;
        --curb: #94a3b8;
        --road: #222834;
        --bay-bg: rgba(241, 245, 249, 0.85);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 12px 10px 24px;
    }
    .viewport {
      background: #14532d;
      border: 2px solid var(--curb);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .greenery {
      height: 32px;
      background: linear-gradient(180deg, var(--grass-top), var(--grass-bot));
      border-bottom: 3px solid var(--curb);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 16px;
    }
    .bush {
      width: 18px;
      height: 18px;
      background: #0b4626;
      border-radius: 50%;
      position: relative;
    }
    .bush::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      top: 2px;
      left: 2px;
    }
    .deck {
      background: var(--road);
      padding: 12px 8px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .bay {
      background: var(--bay-bg);
      border: 1.5px dashed #475569;
      border-radius: 10px;
      padding: 6px 4px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 210px;
    }
    .bay.occupied {
      border: 1.5px solid var(--red);
      background: rgba(239, 68, 68, 0.08);
    }
    .bay.empty {
      border: 1.5px solid var(--emerald);
      background: rgba(16, 185, 129, 0.08);
    }
    .sensor-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f141f;
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 9px;
      color: white;
      margin-bottom: 6px;
    }
    .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .led.green { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
    .led.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .car-area {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .car-svg {
      width: 100%;
      max-width: 84px;
      height: auto;
      aspect-ratio: 100/180;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
    }
    .wheel-stop {
      width: 78%;
      height: 6px;
      background: #1e2532;
      border-radius: 2px;
      margin-top: 6px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .reflector { width: 10px; height: 3px; background: #facc15; }
    .road {
      height: 38px;
      background: #181f2a;
      border-top: 3px solid var(--curb);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }
    .dash { width: 30px; height: 3.5px; background: #facc15; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="greenery">
      <div class="bush"></div>
      <div class="bush"></div>
      <div class="bush"></div>
      <div class="bush"></div>
    </div>
    <div class="deck">
      <div id="bay1" class="bay empty">
        <div class="sensor-bar"><span>SLOT 01</span><div id="led1" class="led green"></div></div>
        <div class="car-area" id="area1"><div style="color:var(--emerald); font-size:10px; font-weight:bold;">✓ VACANT</div></div>
        <div class="wheel-stop"><div class="reflector"></div><div class="reflector"></div></div>
      </div>
      <div id="bay2" class="bay empty">
        <div class="sensor-bar"><span>SLOT 02</span><div id="led2" class="led green"></div></div>
        <div class="car-area" id="area2"><div style="color:var(--emerald); font-size:10px; font-weight:bold;">✓ VACANT</div></div>
        <div class="wheel-stop"><div class="reflector"></div><div class="reflector"></div></div>
      </div>
      <div id="bay3" class="bay empty">
        <div class="sensor-bar"><span>SLOT 03</span><div id="led3" class="led green"></div></div>
        <div class="car-area" id="area3"><div style="color:var(--emerald); font-size:10px; font-weight:bold;">✓ VACANT</div></div>
        <div class="wheel-stop"><div class="reflector"></div><div class="reflector"></div></div>
      </div>
    </div>
    <div class="road">
      <div class="dash"></div>
      <div class="dash"></div>
      <div style="color: white; font-size: 10px; font-weight: bold;">ENTRY ➔</div>
    </div>
  </div>

  <script>
    let firebaseUrl = localStorage.getItem('parking_firebase_url') || 'https://smart-parking-iot-default-rtdb.firebaseio.com/parking_live.json';
    const cars = {
      s1: `<svg class="car-svg" viewBox="0 0 100 180"><defs><linearGradient id="gS" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7f1d1d"/><stop offset="50%" stop-color="#ef4444"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient></defs><rect x="6" y="8" width="88" height="164" rx="22" fill="url(#gS)"/><rect x="1" y="26" width="9" height="32" rx="3" fill="#14171c"/><rect x="90" y="26" width="9" height="32" rx="3" fill="#14171c"/><rect x="1" y="120" width="9" height="32" rx="3" fill="#14171c"/><rect x="90" y="120" width="9" height="32" rx="3" fill="#14171c"/><polygon points="18,68 25,46 75,46 82,68" fill="#090d14"/><rect x="24" y="74" width="52" height="32" rx="6" fill="#0f172a"/><polygon points="22,118 78,118 82,138 18,138" fill="#090d14"/><rect x="13" y="10" width="18" height="7" rx="2" fill="#fff"/><rect x="69" y="10" width="18" height="7" rx="2" fill="#fff"/><rect x="16" y="167" width="68" height="4" rx="2" fill="#ff1a1a"/></svg>`,
      s2: `<svg class="car-svg" viewBox="0 0 100 180"><defs><linearGradient id="gV" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#172554"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#172554"/></linearGradient></defs><rect x="4" y="8" width="92" height="164" rx="24" fill="url(#gV)"/><rect x="0" y="28" width="10" height="34" rx="4" fill="#111418"/><rect x="90" y="28" width="10" height="34" rx="4" fill="#111418"/><rect x="0" y="118" width="10" height="34" rx="4" fill="#111418"/><rect x="90" y="118" width="10" height="34" rx="4" fill="#111418"/><polygon points="16,66 23,44 77,44 84,66" fill="#090d14"/><rect x="24" y="70" width="52" height="22" rx="4" fill="#0f172a"/><rect x="18" y="122" width="64" height="20" rx="4" fill="#090d14"/><rect x="12" y="10" width="20" height="8" rx="2" fill="#fff"/><rect x="68" y="10" width="20" height="8" rx="2" fill="#fff"/><rect x="12" y="166" width="22" height="5" rx="2" fill="#ef4444"/><rect x="66" y="166" width="22" height="5" rx="2" fill="#ef4444"/></svg>`,
      s3: `<svg class="car-svg" viewBox="0 0 100 180"><defs><linearGradient id="gC" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="50%" stop-color="#fde047"/><stop offset="100%" stop-color="#b45309"/></linearGradient></defs><rect x="5" y="8" width="90" height="164" rx="22" fill="url(#gC)"/><rect x="0" y="28" width="10" height="32" rx="3" fill="#14171a"/><rect x="90" y="28" width="10" height="32" rx="3" fill="#14171a"/><rect x="0" y="118" width="10" height="32" rx="3" fill="#14171a"/><rect x="90" y="118" width="10" height="32" rx="3" fill="#14171a"/><rect x="28" y="22" width="12" height="16" rx="3" fill="#141416"/><rect x="60" y="22" width="12" height="16" rx="3" fill="#141416"/><polygon points="18,68 25,48 75,48 82,68" fill="#090d14"/><rect x="24" y="74" width="52" height="28" rx="5" fill="#141416"/><polygon points="22,116 78,116 82,136 18,136" fill="#090d14"/><rect x="8" y="148" width="84" height="7" rx="2.5" fill="#09090b"/><rect x="14" y="10" width="18" height="7" rx="2" fill="#fff"/><rect x="68" y="10" width="18" height="7" rx="2" fill="#fff"/><rect x="16" y="166" width="68" height="4" rx="2" fill="#ef4444"/></svg>`
    };

    function render(bayId, ledId, areaId, occ, svg) {
      const b = document.getElementById(bayId);
      const l = document.getElementById(ledId);
      const a = document.getElementById(areaId);
      if (occ) {
        b.className = 'bay occupied';
        l.className = 'led red';
        a.innerHTML = svg;
      } else {
        b.className = 'bay empty';
        l.className = 'led green';
        a.innerHTML = '<div style="color:var(--emerald); font-size:10px; font-weight:bold;">✓ VACANT</div>';
      }
    }

    function update(d) {
      if (!d) return;
      render('bay1', 'led1', 'area1', Boolean(d.slot1), cars.s1);
      render('bay2', 'led2', 'area2', Boolean(d.slot2), cars.s2);
      render('bay3', 'led3', 'area3', Boolean(d.slot3), cars.s3);
    }

    if (window.EventSource) {
      try {
        const sse = new EventSource(firebaseUrl);
        sse.addEventListener('put', e => {
          try {
            const r = JSON.parse(e.data);
            if (r && r.data) update(r.data);
          } catch (err) {}
        });
        sse.onerror = () => setInterval(poll, 600);
      } catch (e) {
        setInterval(poll, 600);
      }
    } else {
      setInterval(poll, 600);
    }

    async function poll() {
      try {
        const res = await fetch(firebaseUrl, { cache: 'no-store' });
        if (res.ok) update(await res.json());
      } catch (e) {}
    }
    poll();
  </script>
</body>
</html>
