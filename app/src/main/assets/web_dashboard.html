<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Parking Live Dashboard</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131b28;
      --border: #26354a;
      --emerald: #10b981;
      --red: #ef4444;
      --cyan: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 14px;
    }
    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }
    .deck {
      background: #141822;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .bay {
      background: #1a2230;
      border: 1.5px solid var(--emerald);
      border-radius: 8px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 140px;
      justify-content: space-between;
    }
    .bay.occupied {
      border-color: var(--red);
      background: rgba(239, 68, 68, 0.1);
    }
    .bay-title {
      font-size: 10px;
      font-weight: bold;
      color: var(--text-muted);
    }
    .status-text {
      font-size: 11px;
      font-weight: bold;
      color: var(--emerald);
    }
    .bay.occupied .status-text {
      color: var(--red);
    }
    .car {
      width: 48px;
      height: 75px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .gate-bar {
      margin-top: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h3 style="font-size: 14px;">Smart Parking Live Web View</h3>
      <p style="font-size: 10px; color: var(--text-muted);">Shree Sarkari Madhyamik Shala Lakhapar</p>
    </div>
    <div class="badge">LIVE SYNC</div>
  </header>

  <div class="deck">
    <div class="bay occupied">
      <div class="bay-title">SLOT 01</div>
      <div class="car" style="background: #dc2626;">SEDAN</div>
      <div class="status-text">OCCUPIED</div>
    </div>
    <div class="bay">
      <div class="bay-title">SLOT 02</div>
      <div style="font-size: 20px; color: var(--emerald); margin: 18px 0;">✓</div>
      <div class="status-text">FREE</div>
    </div>
    <div class="bay">
      <div class="bay-title">SLOT 03</div>
      <div style="font-size: 20px; color: var(--emerald); margin: 18px 0;">✓</div>
      <div class="status-text">FREE</div>
    </div>
  </div>

  <div class="gate-bar">
    <div><strong>MG995 Gate Servo:</strong> Pin 11</div>
    <div style="color: var(--emerald); font-weight: bold;">OPEN (0°)</div>
  </div>
</body>
</html>
