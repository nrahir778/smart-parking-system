<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Traffic Parking Preview</title>
  <style>
    :root {
      --bg: #090d14;
      --surface: #111827;
      --border: #26354a;
      --emerald: #10b981;
      --red: #ef4444;
      --cyan: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9;
        --surface: #ffffff;
        --border: #cbd5e1;
        --text: #0f172a;
        --text-muted: #64748b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 14px;
    }
    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }
    .park-container {
      background: #14532d;
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .greenery {
      height: 24px;
      background: linear-gradient(180deg, #16a34a, #15803d);
      border-bottom: 3px solid #94a3b8;
    }
    .deck {
      background: #151922;
      padding: 14px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .bay {
      background: #1a2230;
      border: 1.5px solid var(--emerald);
      border-radius: 8px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 150px;
      justify-content: space-between;
    }
    .bay-title {
      font-size: 10px;
      font-weight: bold;
      color: var(--text-muted);
    }
    .status-text {
      font-size: 11px;
      font-weight: bold;
      color: var(--emerald);
    }
    .road {
      height: 32px;
      background: #1a202c;
      border-top: 3px solid #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .dash {
      width: 25px;
      height: 3px;
      background: #facc15;
    }
    .gate-bar {
      margin-top: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h3 style="font-size: 14px;">Smart Traffic Parking Live Web View</h3>
      <p style="font-size: 10px; color: var(--text-muted);">Shree Sarkari Madhyamik Shala Lakhapar</p>
    </div>
    <div class="badge">LIVE SYNC</div>
  </header>

  <div class="park-container">
    <div class="greenery"></div>
    <div class="deck">
      <div class="bay">
        <div class="bay-title">SLOT 01</div>
        <div style="font-size: 18px; color: var(--emerald); margin: 18px 0;">✓</div>
        <div class="status-text">VACANT</div>
      </div>
      <div class="bay">
        <div class="bay-title">SLOT 02</div>
        <div style="font-size: 18px; color: var(--emerald); margin: 18px 0;">✓</div>
        <div class="status-text">VACANT</div>
      </div>
      <div class="bay">
        <div class="bay-title">SLOT 03</div>
        <div style="font-size: 18px; color: var(--emerald); margin: 18px 0;">✓</div>
        <div class="status-text">VACANT</div>
      </div>
    </div>
    <div class="road">
      <div class="dash"></div>
      <div class="dash"></div>
      <div style="color: white; font-size: 10px; font-weight: bold;">ENTRY ➔</div>
    </div>
  </div>

  <div class="gate-bar">
    <div><strong>MG995 Gate Servo:</strong> Pin 11</div>
    <div style="color: var(--emerald); font-weight: bold;">OPEN (0°)</div>
  </div>
</body>
</html>
