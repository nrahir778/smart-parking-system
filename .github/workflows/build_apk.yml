name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding existing debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fresh debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Collect and Package APK
        run: |
          mkdir -p output-apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output-apk/SmartParking-Debug.apk \;
          ls -la output-apk/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartParking-Debug-APK
          path: output-apk/SmartParking-Debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Smart Parking System v1.0.0' }}
          files: output-apk/SmartParking-Debug.apk
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚗 Smart Traffic Parking System - Android APK Release

            ### Features & Updates:
            - **Minimalist Professional Car Models**: Perfectly proportioned top-down vehicle graphics for slots 1, 2, and 3.
            - **HC-05 Bluetooth Telemetry**: Direct Arduino Uno serial integration (Pins 4, 5, 6, 7, 9, 10, 11, 8).
            - **Physical Project Deck**: High-fidelity Lakhapar school project model with grass lawn, pom-pom trees, roadway, MG995 servo barrier & ultrasonic sensors.
            - **Live IoT Cloud Gateway**: Firebase Realtime Database stream with instant sync to the web dashboard.
            - **Auto System Dark/Light Theme**: Harmonious Material Design 3 styling.

            Download **`SmartParking-Debug.apk`** below to install on your Android device!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
